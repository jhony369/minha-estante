<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Minha Estante</title>
<link rel="stylesheet" href="fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#142a25">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
/* VOICE: aconchegante, de leitor para leitor; poucas palavras.
   IDEA: uma estante de madeira de verdade numa parede de biblioteca, com luz quente nas prateleiras.
   PICTURE: a própria estante — lombadas geradas de cada livro, enfeites, luminária que acende.
   COLOUR and TYPE: parede verde-biblioteca, nogueira, luz âmbar; DM Serif Display + Inter; Literata na leitura.
   LAYOUT: coluna de celular — título, "continue lendo", estante, abas; leitor em tela cheia. */
:root{color-scheme:light dark;--wall:light-dark(#d9d2c4,#142a25);--wall2:light-dark(#cfc6b5,#0f211d);--ink:light-dark(#1d1a16,#efe8dc);--mute:light-dark(#5d564c,#a9b5ae);--card:light-dark(#f4efe6,#1b3630);--line:light-dark(#bdb3a1,#2a4a42);--acc:#e0a447;--wood:#5b3a22;--wood2:#3f2716;--back:#22150d}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{background:var(--wall2)}
body{margin:0;min-height:100vh;background:radial-gradient(120% 900px at 50% 0,var(--wall),var(--wall2));color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{max-width:620px;margin:0 auto;padding:max(22px,env(safe-area-inset-top)) 14px max(40px,env(safe-area-inset-bottom))}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font:400 clamp(34px,9vw,46px)/1.02 "DM Serif Display",Georgia,serif;margin:0;text-wrap:balance}
.sub{color:var(--mute);font-size:14px;margin-top:4px}
.btns{display:flex;gap:8px}
.b{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.b.pri{background:var(--acc);border-color:var(--acc);color:#241605}
.b.on{background:var(--ink);color:var(--wall);border-color:var(--ink)}
.stats{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:10px;margin:18px 0 14px;align-items:center}
.ring{width:64px;height:64px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;line-height:1.1;text-align:center}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px}
.stat strong{display:block;font:400 24px/1.1 "DM Serif Display",serif}
.stat span{font-size:13px;color:var(--mute)}
.cont{display:grid;grid-template-columns:74px minmax(0,1fr);gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:16px;text-align:left;width:100%}
.cont .cv{width:74px;height:108px}
.cont h3{margin:0;font:400 20px/1.15 "DM Serif Display",serif;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cont p{margin:2px 0 8px;color:var(--mute);font-size:14px}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:9px}
.cont .meta{display:flex;justify-content:space-between;font-size:13px;margin-top:6px;color:var(--mute)}
.cv{border-radius:4px 8px 8px 4px;overflow:hidden;box-shadow:0 6px 14px rgba(0,0,0,.35);background:#333;flex:none}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.gcover{width:100%;height:100%;padding:10px 8px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(90deg,rgba(0,0,0,.25),rgba(255,255,255,.08) 8%,transparent 20%),var(--c);color:var(--fg)}
.gcover b{font:400 15px/1.1 "DM Serif Display",serif;overflow:hidden}.gcover small{font-size:10px;opacity:.85}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.tabs button{flex:none;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:14px;font-weight:500}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--wall);border-color:var(--ink)}
/* estante */
.case{position:relative;border-radius:10px;padding:12px 12px 0;background:linear-gradient(90deg,#4a2e1a,#6a4428 6%,#5b3a22 50%,#6a4428 94%,#4a2e1a);box-shadow:0 30px 60px -20px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.12)}
.case::before{content:"";position:absolute;left:-6px;right:-6px;top:-10px;height:16px;border-radius:6px;background:linear-gradient(#7a5032,#4f311c);box-shadow:0 3px 6px rgba(0,0,0,.4)}
.shelf{position:relative}
.row{height:158px;display:flex;align-items:flex-end;gap:2px;padding:0 10px;background:linear-gradient(90deg,rgba(0,0,0,.55),transparent 8%,transparent 92%,rgba(0,0,0,.55)),repeating-linear-gradient(90deg,#26170e 0 3px,#2b1a10 3px 9px),var(--back);box-shadow:inset 0 12px 18px -8px rgba(0,0,0,.8);transition:background .5s}
.case.lit .row{background:radial-gradient(70% 55% at 50% 0,rgba(255,200,120,.38),transparent 75%),linear-gradient(90deg,rgba(0,0,0,.5),transparent 8%,transparent 92%,rgba(0,0,0,.5)),repeating-linear-gradient(90deg,#2e1c10 0 3px,#341f12 3px 9px),#2a190e}
.case.lit .row::before{content:"";position:absolute;left:12px;right:12px;top:0;height:3px;background:linear-gradient(90deg,transparent,#ffe2a8,transparent);opacity:.8;filter:blur(1px)}
.plank{height:16px;margin:0 -12px;background:linear-gradient(#8a5a37,#5b3a22 55%,#3f2716);box-shadow:0 6px 10px -2px rgba(0,0,0,.55);position:relative;z-index:1}
.case>.foot{height:18px;margin:0 -12px;border-radius:0 0 10px 10px;background:linear-gradient(#4f311c,#2e1c10)}
.item{flex:none;padding:0;border:0;background:none;position:relative;transform-origin:50% 100%}
.spine{display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:4px;padding:9px 0 7px;border-radius:3px 3px 1px 1px;background:linear-gradient(90deg,rgba(0,0,0,.3),rgba(255,255,255,.16) 16%,rgba(255,255,255,0) 38%,rgba(0,0,0,.06) 72%,rgba(0,0,0,.38)),var(--c);color:var(--fg);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18),2px 0 3px rgba(0,0,0,.4);transition:transform .2s}
.spine .t,.spine .a{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1}
.spine .t{font-size:12px;max-height:calc(100% - 34px)}
.spine .a{font-size:8.5px;opacity:.85;max-height:40px;font-family:Inter,sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.spine.thin .t{font-size:10px}
.s0 .t{font-family:"Bebas Neue",sans-serif;font-size:14px;letter-spacing:.04em}
.s0::before,.s0::after{content:"";position:absolute;left:3px;right:3px;height:2px;background:#d8b46a;top:5px;box-shadow:0 4px 0 #d8b46a}
.s0::after{top:auto;bottom:24px}
.s1 .t{font-family:"Abril Fatface",serif}
.s2 .t{font-family:"Josefin Sans",sans-serif;text-transform:uppercase;font-size:10.5px}
.s2::before{content:"";position:absolute;left:0;right:0;top:22%;height:22%;background:rgba(255,255,255,.18)}
.s3 .t{font-family:"Playfair Display",serif;font-style:italic}
.s4 .t{font-family:Oswald,sans-serif;text-transform:uppercase;font-size:11px}
.s4::before{content:"";position:absolute;left:0;right:0;top:0;height:16px;background:rgba(0,0,0,.35)}
.s5 .t{font-family:"Cormorant SC",serif;font-size:13px}
.spine.img{background:linear-gradient(90deg,rgba(0,0,0,.42),rgba(255,255,255,.2) 12%,rgba(255,255,255,0) 32%,rgba(0,0,0,.08) 70%,rgba(0,0,0,.5)),var(--im) left center/auto 100% no-repeat,var(--c)}
.spine.img::before,.spine.img::after{display:none}
.spine.img .t{background:color-mix(in srgb,var(--c) 84%,transparent);padding:5px 2px;border-radius:2px;max-height:calc(100% - 40px)}
.spine.img .a{background:color-mix(in srgb,var(--c) 84%,transparent);padding:3px 1px;border-radius:2px}
.front{border-radius:2px 6px 6px 2px;overflow:hidden;background:#333;box-shadow:inset 3px 0 4px -2px rgba(0,0,0,.6),4px 4px 8px rgba(0,0,0,.55)}
.front img{width:100%;height:100%;object-fit:cover;display:block}
.front::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(255,255,255,.12) 4%,transparent 12%)}
.front .rib{left:auto;right:10px}
.find{display:flex;gap:8px;margin-bottom:10px}
.find input{flex:1;min-height:44px;border-radius:999px;border:1px solid var(--line);background:var(--card);padding:0 16px;font-size:16px}
.chip{display:inline-flex;align-items:center;gap:6px;margin:0 0 10px;min-height:36px;padding:0 6px 0 14px;border-radius:999px;background:var(--acc);color:#241605;font-size:14px;font-weight:600;border:0}
.chip b{width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.15);display:grid;place-items:center}
.lst button{display:flex;justify-content:space-between;width:100%;min-height:46px;align-items:center;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-size:15px;padding:0 4px}
.lst button span{color:var(--mute);font-size:13px}
.sh2{margin:0 0 12px;font:400 24px 'DM Serif Display',serif}
.tgl{display:flex;justify-content:space-between;align-items:center;min-height:46px;border-bottom:1px solid var(--line);font-size:15px;gap:10px}
.tgl input{width:22px;height:22px;accent-color:var(--acc)}
.fav{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:none;font-size:22px;color:var(--mute);flex:none}
.fav.on{color:#e25555;border-color:#e25555}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpis div{background:var(--wall);border-radius:12px;padding:10px 12px}.kpis strong{display:block;font:400 22px/1.15 'DM Serif Display',serif}.kpis span{font-size:12.5px;color:var(--mute)}
.mbars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end;height:130px;margin-top:6px}
.mbars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--mute);gap:4px}
.mbars i{display:block;width:100%;max-width:34px;background:var(--acc);border-radius:6px 6px 2px 2px;min-height:3px}
.mbars b{color:var(--ink);font-weight:600}
#rtext mark{background:rgba(240,190,70,.45);color:inherit;border-radius:2px}
#hl{position:absolute;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:4;display:none;min-height:44px;padding:0 18px;border-radius:999px;border:0;background:var(--acc);color:#241605;font-weight:600;box-shadow:0 8px 20px rgba(0,0,0,.35)}
#hl.show{display:block}
.note{display:grid;grid-template-columns:minmax(0,1fr) 40px;align-items:center;border-bottom:1px solid color-mix(in srgb,var(--rm) 30%,transparent)}
.note button{border:0;background:none;color:var(--rf);text-align:left;padding:10px 4px;font-size:14px}
.note small{display:block;color:var(--rm);font-size:12px}
.note .x{text-align:center;color:var(--rm);font-size:18px}
.spine.sample{filter:saturate(.75) brightness(.85)}
.rib{position:absolute;bottom:-4px;left:calc(50% - 3px);width:6px;height:16px;background:#c0392b;clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%);z-index:2}
.done-dot{position:absolute;top:4px;left:calc(50% - 3px);width:6px;height:6px;border-radius:50%;background:#e9c46a;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.spine:hover{transform:translateY(-4px)}
.decor svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(2px 2px 2px rgba(0,0,0,.45))}
.decor.lamp::before{content:"";position:absolute;left:-40px;right:-40px;top:20px;height:130px;background:radial-gradient(closest-side,rgba(255,214,130,.55),transparent);opacity:0;transition:opacity .5s;pointer-events:none}
.case.lit .decor.lamp::before{opacity:1}
.case:not(.lit) .bulb{fill:#8d8576}
.flame{transform-origin:13px 16px;animation:fl 1.6s ease-in-out infinite alternate}
@keyframes fl{to{transform:scale(.88,1.08) rotate(3deg)}}
.editing .item{animation:wig .28s ease-in-out infinite alternate}
.editing .item:nth-child(2n){animation-delay:-.14s}
@keyframes wig{from{transform:rotate(-1.4deg)}to{transform:rotate(1.4deg)}}
.item.sel{animation:none!important;transform:translateY(-10px);filter:drop-shadow(0 0 6px var(--acc))}
.sampnote{color:var(--mute);font-size:13px;text-align:center;margin:10px 0 0}
.editbar{position:sticky;bottom:10px;z-index:5;display:none;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px;padding:8px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.editing+.editbar,.editbar.show{display:flex}
.editbar p{flex-basis:100%;margin:0;text-align:center;font-size:13px;color:var(--mute)}
.empty{padding:28px 10px;text-align:center;color:#d8c9b2;font-size:14px;align-self:center;width:100%}
/* folhas */
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--card);color:var(--ink);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .hd{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:start}
.sheet .cv{width:96px;height:140px}
.fld{display:block;width:100%;border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 10px;font-size:16px;margin-bottom:8px}
.fld.ttl{font:400 20px/1.2 "DM Serif Display",serif}
.lbl{font-size:13px;color:var(--mute);margin:14px 0 6px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{min-height:44px;border:0;background:none;font-weight:500;font-size:14px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--card)}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid transparent;background:var(--c)}
.sw button[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 2px var(--card) inset}
.stars{display:flex;gap:4px}.stars button{width:40px;height:40px;border:0;background:none;font-size:26px;color:var(--line);padding:0}.stars button.on{color:var(--acc)}
.acts{display:flex;gap:10px;margin-top:18px}.acts .b{flex:1;justify-content:center}
.b.warn{color:#c0392b}
.dgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.dgrid button{height:96px;border-radius:14px;border:1px solid var(--line);background:#2a190e;padding:10px;display:grid;place-items:end center}
.dgrid svg{max-height:74px;max-width:100%}
.dgrid span{font-size:11px;color:#e8dcc8}
/* leitor */
#reader{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;--rb:#fbf8f2;--rf:#26211b;--rm:#8a8174;background:var(--rb);color:var(--rf)}
#reader.open{display:flex}
#reader.sepia{--rb:#f1e4c8;--rf:#433422;--rm:#8d7856}
#reader.noite{--rb:#1b1d1f;--rf:#d7d2c8;--rm:#7d7a73}
#reader.preto{--rb:#000;--rf:#bdb8ae;--rm:#6d6a64}
.rh{display:flex;align-items:center;gap:4px;padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));background:var(--rb);transition:margin .25s,opacity .25s;height:calc(56px + env(safe-area-inset-top));flex:none}
#reader.imm .rh{opacity:0;pointer-events:none;margin-top:calc(-56px - env(safe-area-inset-top))}
.rh .tt{flex:1;text-align:center;font-size:13px;color:var(--rm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--rf);font-size:20px;display:grid;place-items:center;flex:none}
#stage{flex:1;position:relative;overflow:hidden;touch-action:manipulation;user-select:text;-webkit-user-select:text}
#pager{position:absolute;inset:0;overflow:hidden}
#rtext{position:relative;font-family:Literata,Georgia,serif;font-size:var(--fs,19px);line-height:1.62;overflow-wrap:break-word;hyphens:auto;column-fill:auto;text-align:justify;will-change:transform}
#reader.sans #rtext{font-family:Inter,system-ui,sans-serif}
#rtext img,#rtext svg{max-width:100%;max-height:calc(var(--ph,600px) - 24px);height:auto;object-fit:contain;break-inside:avoid;display:block;margin:0 auto}
#rtext h1,#rtext h2,#rtext h3{font-family:"DM Serif Display",serif;font-weight:400;line-height:1.2;text-align:left;break-after:avoid}
#rtext a{color:inherit}
#rtext p{margin:0 0 .75em}
#pdfv{position:absolute;inset:0;display:none;place-items:center}
#reader.ispdf #pdfv{display:grid}#reader.ispdf #pager{display:none}
#pc{display:block;box-shadow:0 2px 12px rgba(0,0,0,.18);background:#fff}
#reader.noite #pc,#reader.preto #pc{filter:invert(.9) hue-rotate(180deg)}
.rf{flex:none;background:var(--rb);padding:6px 16px max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:2px}
.rch{font-size:12px;color:var(--rm);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:16px}
#rslider{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
#rslider::-webkit-slider-runnable-track{height:5px;border-radius:9px;background:linear-gradient(90deg,var(--acc) var(--p,0%),color-mix(in srgb,var(--rm) 35%,transparent) var(--p,0%))}
#rslider::-moz-range-track{height:5px;border-radius:9px;background:linear-gradient(90deg,var(--acc) var(--p,0%),color-mix(in srgb,var(--rm) 35%,transparent) var(--p,0%))}
#rslider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--acc);margin-top:-6.5px;border:2px solid var(--rb)}
#rslider::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--acc);border:2px solid var(--rb)}
.rinfo{display:flex;justify-content:space-between;font-size:13px;color:var(--rf);gap:10px;white-space:nowrap}
.rinfo span:last-child{color:var(--rm)}
#rset{position:absolute;right:10px;top:calc(56px + env(safe-area-inset-top));width:min(330px,calc(100% - 20px));max-height:70vh;overflow:auto;background:var(--rb);color:var(--rf);border:1px solid var(--rm);border-radius:16px;padding:14px;display:none;box-shadow:0 20px 40px rgba(0,0,0,.35);z-index:5}
#rset.open{display:block}
#rset .lbl{color:var(--rm)}
#rset .tgl{border-color:color-mix(in srgb,var(--rm) 30%,transparent)}
.thm{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.thm button{height:44px;border-radius:10px;border:2px solid transparent;font-size:12px}
.thm button[aria-pressed=true]{border-color:var(--acc)}
.szr{display:flex;align-items:center;gap:8px}.szr button{flex:1;min-height:44px;border-radius:10px;border:1px solid var(--rm);background:none;color:var(--rf)}
.toc button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--rf);padding:10px 4px;border-bottom:1px solid color-mix(in srgb,var(--rm) 30%,transparent);font-size:14px}
.toc button.cur{color:var(--acc);font-weight:600}
.rload{position:absolute;inset:0;display:grid;place-items:center;color:var(--rm);pointer-events:none;text-align:center;padding:30px}
.endc{position:absolute;inset:0;z-index:4;display:none;place-items:center;background:var(--rb);text-align:center;padding:30px}
.endc.show{display:grid}
.endc h2{font:400 30px/1.15 "DM Serif Display",serif;margin:0 0 8px}
.endc p{color:var(--rm);margin:0 0 18px}
.endc button{min-height:48px;padding:0 22px;border-radius:999px;border:0;background:var(--acc);color:#241605;font-weight:600;font-size:16px;margin:4px}
.endc button.sec{background:none;border:1px solid var(--rm);color:var(--rf)}

function normalize(s){const d=defaults();s=Object.assign(d,s);s.read=Object.assign(d.read,s.read);s.stats=Object.assign(d.stats,s.stats);
 const seen=new Set();s.order=(s.order||[]).filter(id=>(s.books[id]||s.decor[id])&&!seen.has(id)&&seen.add(id));
 for(const id of Object.keys(s.books))if(!seen.has(id))s.order.push(id);for(const id of Object.keys(s.decor))if(!seen.has(id))s.order.push(id);return s}

const IDB={p:null,open(){return this.p||(this.p=new Promise((res,rej)=>{const r=indexedDB.open('estante',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
 async run(mode,fn){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction('f',mode);const r=fn(t.objectStore('f'));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})},

function b64Blob(t,type){const s=atob(t.trim()),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return new Blob([u],{type})}

const cvCache={};

const libs={};
function loadScript(src){return libs[src]||(libs[src]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>{delete libs[src];rej(new Error('lib'))};document.head.appendChild(s)}))}

/* ---- EPUB ---- */
function resolve(base,href){href=decodeURIComponent(String(href).split('#')[0]);if(href.startsWith('/'))return href.slice(1);const parts=(base?base.split('/'):[]).concat(href.split('/'));const out=[];for(const p of parts){if(p==='..')out.pop();else if(p&&p!=='.')out.push(p)}return out.join('/')}
const dir=p=>p.includes('/')?p.slice(0,p.lastIndexOf('/')):'';
const xml=t=>new DOMParser().parseFromString(t,'application/xml');
const byTag=(d,t)=>Array.from(d.getElementsByTagNameNS('*',t));
async function epubOpen(blob){await loadZip();const zip=await JSZip.loadAsync(blob);
 const cf=zip.file('META-INF/container.xml');if(!cf)throw new Error('epub');
 const opfPath=byTag(xml(await cf.async('text')),'rootfile')[0].getAttribute('full-path');
 const opf=xml(await zip.file(opfPath).async('text'));const base=dir(opfPath);
 const man={};byTag(opf,'item').forEach(i=>man[i.getAttribute('id')]={path:resolve(base,i.getAttribute('href')),type:i.getAttribute('media-type')||'',props:i.getAttribute('properties')||''});
 const spineEl=byTag(opf,'spine')[0];
 const spine=byTag(opf,'itemref').filter(r=>r.getAttribute('linear')!=='no').map(r=>man[r.getAttribute('idref')]).filter(m=>m&&/html|xml/.test(m.type)&&zip.file(m.path)).map(m=>m.path);
 const txt=t=>(byTag(opf,t)[0]||{}).textContent||'';
 let coverId=null;byTag(opf,'meta').forEach(m=>{if(m.getAttribute('name')==='cover')coverId=m.getAttribute('content')});
 let cover=Object.values(man).find(m=>/cover-image/.test(m.props))||(coverId&&man[coverId])||Object.values(man).find(m=>/^image\//.test(m.type)&&/cover/i.test(m.path));
 const toc={};
 try{const nav=Object.values(man).find(m=>/\bnav\b/.test(m.props));
  if(nav){const d=new DOMParser().parseFromString(await zip.file(nav.path).async('text'),'text/html');d.querySelectorAll('nav a[href]').forEach(a=>{const p=resolve(dir(nav.path),a.getAttribute('href'));if(!toc[p])toc[p]=a.textContent.trim()})}
  else{const ncx=man[spineEl&&spineEl.getAttribute('toc')]||Object.values(man).find(m=>/ncx/.test(m.type));if(ncx){const d=xml(await zip.file(ncx.path).async('text'));byTag(d,'navPoint').forEach(n=>{const c=byTag(n,'content')[0],l=byTag(n,'text')[0];if(c&&l){const p=resolve(dir(ncx.path),c.getAttribute('src'));if(!toc[p])toc[p]=l.textContent.trim()}})}}}catch(e){}
 return {zip,spine,toc,title:txt('title').trim(),author:txt('creator').trim(),cover:cover&&zip.file(cover.path)?cover.path:null}}
async function epubMeta(file){const E=await epubOpen(file);const chw=[];
 for(const p of E.spine){const t=await E.zip.file(p).async('text');chw.push(Math.max(1,countWords(t.replace(/<head[\s\S]*?<\/head>/i,'').replace(/<[^>]+>/g,' '))))}
 let cover=null;if(E.cover){try{cover=await shrink(await E.zip.file(E.cover).async('blob'))}catch(e){}}
 return {title:E.title,author:E.author,chw,words:chw.reduce((a,b)=>a+b,0),cover}}
const countWords=t=>(t.match(/[\p{L}\p{N}]+/gu)||[]).length;
async function shrink(blob,W=720){const bm=await createImageBitmap(blob);const w=Math.min(W,bm.width),h=Math.round(bm.height*w/bm.width);const c=document.createElement('canvas');c.width=w;c.height=Math.min(h,Math.round(w*1.7));const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(bm,0,0,w,h);return await new Promise(r=>c.toBlob(r,'image/jpeg',.88))}
async function avgColor(blob){try{const bm=await createImageBitmap(blob);const c=document.createElement('canvas');c.width=c.height=8;const x=c.getContext('2d');x.drawImage(bm,0,0,8,8);const d=x.getImageData(0,0,8,8).data;let r=0,g=0,b=0;for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2]}const n=d.length/4,f=v=>Math.round(v/n*.85).toString(16).padStart(2,'0');return '#'+f(r)+f(g)+f(b)}catch(e){return null}}
async function pdfMeta(file){await loadPdf();const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false}).promise;
 let title='',author='';try{const m=await pdf.getMetadata();title=(m.info&&m.info.Title)||'';author=(m.info&&m.info.Author)||''}catch(e){}
 let cover=null;try{const pg=await pdf.getPage(1);const v1=pg.getViewport({scale:1});const vp=pg.getViewport({scale:720/v1.width});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;cover=await new Promise(r=>c.toBlob(r,'image/jpeg',.88))}catch(e){}
 if(/^(about:blank|untitled|sem t[íi]tulo|document\d*|microsoft word.*\.docx?)$/i.test(title.trim())||/^https?:/i.test(title))title='';title=title.replace(/^microsoft (word|powerpoint) - /i,'').trim();

async function readTxt(blob){const buf=await blob.arrayBuffer();let t=new TextDecoder('utf-8').decode(buf);if((t.match(/\uFFFD/g)||[]).length>20)t=new TextDecoder('windows-1252').decode(buf);return t}

async function importFiles(files){
 const list=Array.from(files);let ok=0;
 for(const [i,f] of list.entries()){
  toast(`Colocando na estante… ${list.length>1?(i+1)+' de '+list.length:''}`,60000);

  if(!fmt){toast('“'+f.name+'” não é EPUB, PDF ou TXT');continue}
  try{

async function openEpub(blob){const E=await epubOpen(blob);R.E=E;const b=R.b;if(!b.chw||b.chw.length!==E.spine.length)b.chw=E.spine.map(()=>1);

const MIME={jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',gif:'image/gif',svg:'image/svg+xml',webp:'image/webp'};
async function zipURL(path){const f=R.E.zip.file(path);if(!f)return '';const u=URL.createObjectURL(new Blob([await f.async('arraybuffer')],{type:MIME[path.split('.').pop().toLowerCase()]||''}));R.urls.push(u);return u}
async function renderCh(ch,frac,frag,atEnd){const E=R.E;const path=E.spine[ch];const base=dir(path);
 const t=await E.zip.file(path).async('text');let d=new DOMParser().parseFromString(t,'application/xhtml+xml');if(d.querySelector('parsererror'))d=new DOMParser().parseFromString(t,'text/html');
 const body=d.body||d.getElementsByTagName('body')[0]||d.documentElement;

 const jobs=[];
 body.querySelectorAll('*').forEach(el=>{for(const a of Array.from(el.attributes)){const n=a.name.toLowerCase();if(n.startsWith('on')||n==='style'||n==='class'||n==='srcset'||n==='width'||n==='height')el.removeAttribute(a.name)}
  const tag=el.localName;
  if(tag==='img'){const s=el.getAttribute('src');el.removeAttribute('src');if(s)jobs.push(zipURL(resolve(base,s)).then(u=>u&&el.setAttribute('src',u)))}
  else if(tag==='image'){const s=el.getAttribute('href')||el.getAttributeNS('http://www.w3.org/1999/xlink','href');el.removeAttribute('href');el.removeAttributeNS('http://www.w3.org/1999/xlink','href');if(s)jobs.push(zipURL(resolve(base,s)).then(u=>u&&el.setAttribute('href',u)))}
  else if(tag==='a'){const h=el.getAttribute('href');el.removeAttribute('href');if(h){if(/^https:\/\//i.test(h)){el.setAttribute('href',h);el.setAttribute('target','_blank');el.setAttribute('rel','noopener')}else if(!/^[a-z]+:/i.test(h)){el.dataset.go=(h.startsWith('#')?path:resolve(base,h))+'#'+(h.split('#')[1]||'');el.setAttribute('href','#')}}}});
 await Promise.all(jobs);if(!R||R.E!==E)return;

 $('#rtitle').textContent=R.b.title;
 await Promise.race([Promise.all(Array.from(rt.querySelectorAll('img')).map(i=>i.decode?i.decode().catch(()=>{}):0)),new Promise(r=>setTimeout(r,900))]);
 if(!R||R.E!==E)return;
 layout();let pg=atEnd?R.np-1:Math.min(R.np-1,Math.round(frac*R.np));
 if(frag){const el=rt.querySelector('#'+CSS.escape(frag));if(el)pg=pageOf(el)}
 go(pg,false)}
async function openTxt(blob){const t=await readTxt(blob);if(!R.b.words)R.b.words=countWords(t);let paras=t.split(/\r?\n\s*\r?\n/);if(paras.length<5)paras=t.split(/\r?\n/);

 Object.assign(rt.style,{width:cw+'px',height:chh+'px',columnWidth:cw+'px',columnGap:R.gap+'px',transition:'none',transform:'none'});rt.style.setProperty('--ph',chh+'px');

async function openPdf(blob){await loadPdf();const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await blob.arrayBuffer()),isEvalSupported:false}).promise;R.pdf=pdf;R.cache=new Map();const n=pdf.numPages;const b=R.b;

 applyRead();const start=(b.pos&&b.pos.page)||Math.max(1,Math.round((b.pct||0)*n));await showPdf(Math.min(n,start),0)}
async function pdfBitmap(p){const crop=S.read.crop!==false;const key=p+(crop?'c':'');if(R.cache.has(key))return R.cache.get(key);
 const job=(async()=>{const page=await R.pdf.getPage(p);const v1=page.getViewport({scale:1});const tw=Math.min(2400,Math.max(900,stage.clientWidth*(devicePixelRatio||1)*1.6));const vp=page.getViewport({scale:tw/v1.width});
  const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);await page.render({canvasContext:x,viewport:vp}).promise;
  let box={sx:0,sy:0,sw:c.width,sh:c.height};
  if(crop){const sw=160,sh=Math.round(c.height*sw/c.width);const t=document.createElement('canvas');t.width=sw;t.height=sh;const tx=t.getContext('2d');tx.drawImage(c,0,0,sw,sh);const d=tx.getImageData(0,0,sw,sh).data;let x0=sw,y0=sh,x1=-1,y1=-1;
   for(let yy=0;yy<sh;yy++)for(let xx=0;xx<sw;xx++){const i=(yy*sw+xx)*4;if(d[i]*.3+d[i+1]*.59+d[i+2]*.11<232){if(xx<x0)x0=xx;if(xx>x1)x1=xx;if(yy<y0)y0=yy;if(yy>y1)y1=yy}}
   if(x1>x0&&y1>y0&&(x1-x0)*(y1-y0)>sw*sh*.08){const k=c.width/sw,m=Math.round(c.width*.025);box={sx:Math.max(0,x0*k-m),sy:Math.max(0,y0*k-m),sw:0,sh:0};box.sw=Math.min(c.width,(x1+1)*k+m)-box.sx;box.sh=Math.min(c.height,(y1+1)*k+m)-box.sy}}

 try{return await job}catch(e){R.cache.delete(key);throw e}}
async function showPdf(p,d){const pdf=R.pdf;R.page=p;progress();const bm=await pdfBitmap(p);if(!R||R.pdf!==pdf||R.page!==p)return;
 const W=stage.clientWidth-12,H=stage.clientHeight-12,dpr=devicePixelRatio||1;const sc=Math.min(W/bm.sw,H/bm.sh);const dw=Math.floor(bm.sw*sc),dh=Math.floor(bm.sh*sc);
 pc.width=Math.round(dw*dpr);pc.height=Math.round(dh*dpr);pc.style.width=dw+'px';pc.style.height=dh+'px';const x=pc.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(bm.c,bm.sx,bm.sy,bm.sw,bm.sh,0,0,pc.width,pc.height);

$('#rsetb').onclick=e=>{e.stopPropagation();const s=$('#rset');if(!s.classList.contains('open'))renderSet();s.classList.toggle('open')};
$('#rset').addEventListener('change',e=>{if(e.target.id==='crop'&&R&&R.pdf){S.read.crop=e.target.checked;save();showPdf(R.page,0)}});
$('#rset').addEventListener('click',e=>{const t=e.target.closest('button');if(!t||!R)return;const r=S.read;
 if(t.dataset.bg){r.bg=t.dataset.bg;applyRead()}
 if(t.dataset.ft||t.dataset.sz){if(t.dataset.ft)r.font=t.dataset.ft;if(t.dataset.sz)r.size=Math.min(30,Math.max(14,r.size+ +t.dataset.sz));applyRead();R.wps=0;relayout()}
 if(t.dataset.goch){$('#rset').classList.remove('open');renderCh(+t.dataset.goch,0);return}
 if(t.dataset.note){goNote(R.b.notes[+t.dataset.note]);return}
 if(t.dataset.delnote){R.b.notes.splice(+t.dataset.delnote,1);save();renderSet();if(!R.pdf){rt.querySelectorAll('mark').forEach(m=>m.replaceWith(...m.childNodes));paintMarks()}return}
 save();renderSet()});

let tT=null;function toast(m,ms=2600){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),ms)}
const roCase=new ResizeObserver(()=>renderCase());roCase.observe($('#case'));
